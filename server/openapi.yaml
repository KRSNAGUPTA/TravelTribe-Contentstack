openapi: 3.1.0
info:
  title: TravelTribe API
  version: 2.2.0
  description: |
    Backend API for TravelTribe — a hostel booking platform with a hold-first reservation model.

    ## Booking flow (hold-first, 5 steps)

    1. `GET /api/booking/availability` — fetch the per-night calendar for a hostel + room type.
    2. `POST /api/booking/hold` — creates a `pending` booking that holds inventory for 15 minutes. Server computes price from hostel's `price_per_night × nights`. Client sends guest details and `idempotencyKey`.
    3. `POST /api/payment/create-order` — creates a Razorpay order using the server-computed amount. Client sends only `bookingId` + `idempotencyKey`.
    4. User completes Razorpay checkout in browser.
    5. `POST /api/payment/verify-payment` — verifies HMAC signature, re-checks availability and price, atomically confirms booking, returns confirmed booking. If hold expired or availability gone, initiates refund and returns 409 with `refundInitiated: true`.

    ## Hostel initialization

    Hostel documents are lazily created in MongoDB on first access. Contentstack uses `base_price` (rupees); server converts to `price_per_night` (paise).

    ## Inventory model

    - `room_types[].total_beds` is physical capacity (immutable).
    - Availability is derived from active bookings (`status ∈ {pending, confirmed}`) overlapping each night.
    - Check-in day is occupied; check-out day is NOT occupied (same-day turnover allowed).

    ## Background jobs

    - `expireHolds` (every 1 min) — pending → expired + email.
    - `expirePayments` (every 5 min) — created orders past TTL → expired.

servers:
  - url: https://your-api-domain.com
    description: Production
  - url: http://localhost:5001
    description: Local dev

tags:
  - name: Auth
  - name: Users
  - name: Hostels
  - name: Availability
  - name: Bookings
  - name: Payments
  - name: Reviews
  - name: Misc

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token (15 min). Refresh tokens are HttpOnly cookies scoped to `/api/user/refresh`.

  schemas:
    UserPublic:
      type: object
      properties:
        id: { type: string, example: "664e1f2a3b4c5d6e7f8a9b0c" }
        name: { type: string, example: "Arjun Sharma" }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin] }
        phone: { type: string }

    AuthResponse:
      type: object
      properties:
        message: { type: string }
        accessToken: { type: string, description: JWT access token, valid 15 minutes }
        user: { $ref: "#/components/schemas/UserPublic" }

    RoomTypeSummary:
      type: object
      properties:
        room_key: { type: string, example: "single" }
        room_name: { type: string, example: "Single" }
        base_price:
          type: integer
          description: Price per night in RUPEES (CMS source of truth)
          example: 2000
        total_beds: { type: integer, example: 4 }

    RoomMeta:
      type: object
      properties:
        room_key: { type: string, example: "single" }
        room_name: { type: string, example: "Single" }
        totalBeds: { type: integer, example: 4 }
        price_per_night:
          type: integer
          description: Price in paise (server-side, from CMS base_price × 100)
          example: 200000

    RoomAvailability:
      type: object
      properties:
        totalBeds: { type: integer }
        booked: { type: integer }
        available: { type: integer }

    DayAvailability:
      type: object
      properties:
        date: { type: string, format: date, example: "2025-12-01" }
        rooms:
          type: object
          additionalProperties: { $ref: "#/components/schemas/RoomAvailability" }

    AvailabilityResponse:
      type: object
      properties:
        hostelId: { type: string }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        nights: { type: integer }
        rooms:
          type: array
          items: { $ref: "#/components/schemas/RoomMeta" }
        calendar:
          type: array
          items: { $ref: "#/components/schemas/DayAvailability" }

    Guest:
      type: object
      required: [name, email, phone, gender]
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 20 }
        gender: { type: string, enum: [male, female, other] }

    Booking:
      type: object
      properties:
        _id: { type: string }
        user: { type: string }
        hostelId: { type: string, description: Contentstack entry UID }
        checkInDate: { type: string, format: date-time, description: UTC midnight }
        checkOutDate: { type: string, format: date-time, description: UTC midnight; not an occupied night }
        nights: { type: integer }
        roomSelection: { type: string, example: "single" }
        price_per_night_snapshot: { type: integer, description: Price in paise }
        amount: { type: integer, description: Total in paise }
        currency: { type: string, example: "INR" }
        guest: { $ref: "#/components/schemas/Guest" }
        status: { type: string, enum: [pending, confirmed, cancelled, expired] }
        holdExpiresAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        expiredAt: { type: string, format: date-time, nullable: true }
        cancellationReason: { type: string, nullable: true }
        payment: { type: string, nullable: true }
        statusHistory:
          type: array
          items:
            type: object
            properties:
              from: { type: string, nullable: true }
              to: { type: string }
              at: { type: string, format: date-time }
              by: { type: string, nullable: true }
              reason: { type: string, nullable: true }
        idempotencyKey: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HoldBookingRequest:
      type: object
      required: [hostelId, roomSelection, checkIn, checkOut, guest, idempotencyKey]
      properties:
        hostelId: { type: string, example: "blt1234abcd5678ef90" }
        roomSelection: { type: string, example: "single", description: Must match CMS `room_key` case-sensitively }
        checkIn:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2025-12-01"
        checkOut:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2025-12-04"
        guest: { $ref: "#/components/schemas/Guest" }
        idempotencyKey: { type: string, example: "6f3a2b1c-...-..." }

    HoldBookingResponse:
      type: object
      properties:
        booking: { $ref: "#/components/schemas/Booking" }
        holdExpiresAt: { type: string, format: date-time }
        amount: { type: integer, description: Amount in paise }

    CreateOrderRequest:
      type: object
      required: [bookingId, idempotencyKey]
      properties:
        bookingId: { type: string }
        idempotencyKey: { type: string }

    CreateOrderResponse:
      type: object
      properties:
        orderId: { type: string, example: "order_PJXxxxxxxxxxxx" }
        amount: { type: integer, description: Amount in paise }
        currency: { type: string, example: "INR" }
        keyId: { type: string }

    VerifyPaymentRequest:
      type: object
      required: [razorpay_order_id, razorpay_payment_id, razorpay_signature]
      properties:
        razorpay_order_id: { type: string }
        razorpay_payment_id: { type: string }
        razorpay_signature: { type: string }

    VerifyPaymentResponse:
      type: object
      properties:
        message: { type: string }
        booking: { $ref: "#/components/schemas/Booking" }

    VerifyPaymentRefundResponse:
      type: object
      properties:
        message: { type: string }
        refundInitiated: { type: boolean, example: true }

    Review:
      type: object
      properties:
        _id: { type: string }
        user: { type: string }
        booking: { type: string }
        name: { type: string }
        img: { type: string, nullable: true }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        createdAt: { type: string, format: date-time }

    AddReviewRequest:
      type: object
      required: [rating, comment]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, minLength: 5, maxLength: 1000 }

    Error:
      type: object
      properties:
        message: { type: string }

  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but insufficient role
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Duplicate or state conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited or too many attempts
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

paths:
  /api/user/signup:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
                phone: { type: string }
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      email: { type: string }
        "400":
          description: Details missing or password too short
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/user/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/user/google/callback:
    post:
      tags: [Auth]
      summary: Google OAuth login or first-time registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: Google ID token }
      responses:
        "200":
          description: Google login successful
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: No token provided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/user/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue a new access token
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  accessToken: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Invalid, expired, or reused refresh token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/user/logout:
    post:
      tags: [Auth]
      summary: Log out and revoke the refresh token
      responses:
        "200":
          description: Logged out (always 200)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /api/user/forgot-password:
    post:
      tags: [Auth]
      summary: Request a 6-digit OTP for password reset
      description: Anti-enumeration — always 200 with the same message regardless of whether the email is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Generic success (sent or suppressed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "If an account exists, an OTP has been sent."
        "400":
          description: Missing email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/user/verify-otp:
    post:
      tags: [Auth]
      summary: Verify the OTP before resetting password
      description: Enforces a 5-attempt limit per OTP. After 5 wrong attempts, the OTP is invalidated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email }
                otp: { type: string }
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400":
          description: Invalid or expired OTP
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/user/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using a verified OTP
      description: On success, the OTP is consumed and all outstanding refresh tokens for the user are invalidated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword]
              properties:
                email: { type: string, format: email }
                otp: { type: string }
                newPassword: { type: string, minLength: 6 }
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400":
          description: Invalid OTP or password too short
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/user/profile:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Profile returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  userData: { $ref: "#/components/schemas/UserPublic" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/user/update:
    patch:
      tags: [Users]
      summary: Update the authenticated user's profile
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                password: { type: string, minLength: 6 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400":
          description: Password too short
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Email already in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/user/all:
    get:
      tags: [Users]
      summary: Get all users (admin only)
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserPublic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/user/search:
    get:
      tags: [Users]
      summary: Search users (admin only)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: query
          schema: { type: string }
        - in: query
          name: role
          schema: { type: string, enum: [user, admin] }
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/UserPublic" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/user/{id}:
    get:
      tags: [Users]
      summary: Get a user by ID (authenticated)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "400":
          description: Invalid ID format
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Users]
      summary: Delete a user (admin only)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/user/make-admin/{id}:
    patch:
      tags: [Users]
      summary: Promote a user to admin (admin only)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User promoted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/user/remove-admin/{id}:
    patch:
      tags: [Users]
      summary: Demote an admin to user (admin only)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Admin demoted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/hostel:
    get:
      tags: [Hostels]
      summary: List hostels from Contentstack with filters and pagination
      description: Proxies Contentstack entries. CMS uses `base_price` (rupees); Mongo stores `price_per_night` (paise).
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 6 }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: college
          schema: { type: string }
        - in: query
          name: location
          schema: { type: string }
        - in: query
          name: price
          schema: { type: string }
      responses:
        "200":
          description: Paginated hostel list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        uid: { type: string }
                        title: { type: string }
                        address: { type: string }
                        nearby_college:
                          type: array
                          items: { type: string }
                        images:
                          type: array
                          items:
                            type: object
                            properties:
                              url: { type: string }
                        room_types:
                          type: array
                          items: { $ref: "#/components/schemas/RoomTypeSummary" }
                  pagination:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      limit: { type: integer }
                      totalPages: { type: integer }
                      hasNextPage: { type: boolean }
                      hasPrevPage: { type: boolean }
        "502":
          description: Contentstack unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/hostel/{id}:
    get:
      tags: [Hostels]
      summary: Get the MongoDB record for a hostel
      description: |
        Mongo hostel record. If the hostel was never lazily initialized
        (no booking/availability call touched it), returns an empty shell
        with `reviews: []` and `room_types: []`. Once initialized by
        `ensureHostelInDb`, `room_types[].price_per_night` is in paise
        (converted from CMS `base_price × 100`).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Hostel DB record (or empty shell if not initialized)
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostelId: { type: string }
                  reviews:
                    type: array
                    items: { $ref: "#/components/schemas/Review" }
                  room_types:
                    type: array
                    items:
                      type: object
                      properties:
                        room_key: { type: string }
                        room_name: { type: string }
                        total_beds: { type: integer }
                        price_per_night:
                          type: integer
                          nullable: true
                          description: Price in paise (server-side, from CMS base_price × 100)
        "404":
          description: Hostel not found in CMS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Hostels]
      summary: Delete a hostel DB record (admin only)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Hostel deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Active bookings exist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/booking/availability:
    get:
      tags: [Availability]
      summary: Per-night availability calendar
      parameters:
        - in: query
          name: hostelId
          required: true
          schema: { type: string }
        - in: query
          name: checkIn
          required: true
          schema: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - in: query
          name: checkOut
          required: true
          schema: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - in: query
          name: roomSelection
          schema: { type: string }
      responses:
        "200":
          description: Availability calendar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityResponse" }
        "400":
          description: Missing params, invalid dates, or range > 90 nights
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Hostel not found in CMS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/booking/hold:
    post:
      tags: [Bookings]
      summary: Create a pending booking that holds inventory for 15 minutes
      description: |
        Server-authoritative: client does not send amount, price, or receipt.
        Idempotent: same (user, idempotencyKey) returns the existing booking (200).
        Inventory: pending bookings count against availability.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldBookingRequest" }
      responses:
        "201":
          description: Hold created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HoldBookingResponse" }
        "200":
          description: Existing hold returned (idempotent retry)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HoldBookingResponse" }
        "400":
          description: Missing fields, invalid dates, past check-in, or stay outside 1–90 nights
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Room type not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: No availability, idempotency key collision, or booking write conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/booking:
    get:
      tags: [Bookings]
      summary: Get all bookings, paginated (admin only)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Paginated bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items: { $ref: "#/components/schemas/Booking" }
                  pagination:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      limit: { type: integer }
                      totalPages: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/booking/my-bookings:
    get:
      tags: [Bookings]
      summary: Get the authenticated user's bookings
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: User's bookings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/booking/{id}:
    get:
      tags: [Bookings]
      summary: Get a booking by ID (owner or admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Booking found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/booking/{id}/cancel:
    put:
      tags: [Bookings]
      summary: Cancel a booking (owner or admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  booking: { $ref: "#/components/schemas/Booking" }
        "400":
          description: Already cancelled or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/booking/{id}/receipt:
    get:
      tags: [Bookings]
      summary: Generate a receipt for a confirmed booking (owner or admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Receipt data
          content:
            application/json:
              schema:
                type: object
                properties:
                  receipt:
                    type: object
                    properties:
                      bookingId: { type: string }
                      receiptId: { type: string }
                      user: { type: string }
                      email: { type: string }
                      phone: { type: string }
                      checkIn: { type: string, format: date-time }
                      checkOut: { type: string, format: date-time }
                      nights: { type: integer }
                      roomSelection: { type: string }
                      price_per_night: { type: integer }
                      totalAmount: { type: integer }
                      currency: { type: string }
                      status: { type: string }
                      confirmedAt: { type: string, format: date-time }
        "400":
          description: Booking not confirmed yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/payment/create-order:
    post:
      tags: [Payments]
      summary: Create a Razorpay order for a held booking
      description: Server reads amount from held booking (never from client). Same (user, idempotencyKey) returns the existing order.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "200":
          description: Razorpay order created (or returned for retry)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateOrderResponse" }
        "400":
          description: Missing fields, booking not pending, hold expired, or booking not owned by user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Booking belongs to a different user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Booking not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Idempotency key exists in a non-created state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Razorpay not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Razorpay upstream error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/payment/verify-payment:
    post:
      tags: [Payments]
      summary: Verify Razorpay signature, confirm the booking, or refund
      description: |
        Uses timing-safe HMAC-SHA256 comparison. On success, atomically:
        1. Consumes the Payment (verified → consumed)
        2. Confirms the Booking (pending → confirmed)
        3. Links them via Booking.payment and Payment.booking

        Refund path: if the held booking expired, price changed, or availability disappeared,
        the Payment is marked `refunded`, a Razorpay refund is initiated, and the endpoint
        returns 409 with `refundInitiated: true`.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyPaymentRequest" }
      responses:
        "200":
          description: Payment verified and booking confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyPaymentResponse" }
        "400":
          description: Missing fields, invalid signature, or expired order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Payment belongs to a different user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Payment or held booking not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Payment verified but refunded — hold expired, price changed, or availability gone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyPaymentRefundResponse" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/hostel/{id}/reviews:
    get:
      tags: [Reviews]
      summary: Get all reviews for a hostel
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reviews with average rating
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items: { $ref: "#/components/schemas/Review" }
                  avgRating: { type: number }
                  count: { type: integer }
    post:
      tags: [Reviews]
      summary: Add a review (requires a confirmed booking at this hostel)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddReviewRequest" }
      responses:
        "201":
          description: Review added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  review: { $ref: "#/components/schemas/Review" }
        "400":
          description: Invalid rating or comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: No confirmed booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Already reviewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/hostel/{id}/reviews/{reviewId}:
    delete:
      tags: [Reviews]
      summary: Delete a review (author or admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: reviewId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Review deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not author or admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api:
    get:
      tags: [Misc]
      summary: API welcome / health
      responses:
        "200":
          description: API is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /health/live:
    get:
      tags: [Misc]
      summary: Liveness probe
      responses:
        "200":
          description: Process is running
          content:
            text/plain:
              schema: { type: string, example: "ok" }

  /health/ready:
    get:
      tags: [Misc]
      summary: Readiness probe
      responses:
        "200":
          description: All dependencies ready
          content:
            text/plain:
              schema: { type: string, example: "ok" }
        "503":
          description: MongoDB not ready
          content:
            text/plain:
              schema: { type: string, example: "db not ready" }

  /metrics:
    get:
      tags: [Misc]
      summary: Prometheus metrics (token-protected)
      description: |
        Requires the `METRICS_TOKEN` environment variable to be set on the server.
        The token can be passed as `Authorization: Bearer <token>` or
        `X-Metrics-Token: <token>`. Browsers cannot send custom headers via
        the address bar — use curl, Prometheus (`bearer_token_file`), or the
        ModHeader extension. Returns 404 if `METRICS_TOKEN` is unset, 401 on
        wrong token.
      responses:
        "200":
          description: Prometheus exposition format
          content:
            text/plain:
              schema: { type: string }
        "401":
          description: Missing or invalid metrics token
        "404":
          description: Metrics endpoint disabled (METRICS_TOKEN unset)

  /api/support:
    post:
      tags: [Misc]
      summary: Send a support request to Discord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, topic, message]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                topic: { type: string }
                message: { type: string }
                url: { type: string }
      responses:
        "200":
          description: Sent (or suppressed if webhook not configured)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/subscribe:
    post:
      tags: [Misc]
      summary: Newsletter subscription (forwarded to Discord)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, url]
              properties:
                email: { type: string, format: email }
                url: { type: string }
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400":
          description: Missing email or url
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }