      tags: [Reviews]
      summary: Get all reviews for a hostel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reviews with average rating
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
                  avgRating:
                    type: number
                  count:
                    type: integer
    post:
      tags: [Reviews]
      summary: Add a review (requires a confirmed booking at this hostel)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddReviewRequest"
      responses:
        "201":
          description: Review added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  review:
                    $ref: "#/components/schemas/Review"
        "400":
          description: Invalid rating or comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No confirmed booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/hostel/{id}/reviews/{reviewId}:
    delete:
      tags: [Reviews]
      summary: Delete a review (author or admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not author or admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════════════════
  # PAYMENTS
  # ═══════════════════════════════════════════════════════════════════════════

  /api/payment/create-order:
    post:
      tags: [Payments]
      summary: Create a Razorpay order (step 1 of payment flow)
      description: >
        Creates a Razorpay order AND a matching Payment document in MongoDB
        with `status: "created"`. The `paymentId` returned by
        `/api/payment/verify-payment` is what gates the booking.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: Razorpay order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          description: Missing or invalid amount / hostelId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Razorpay not configured or upstream error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/payment/verify-payment:
    post:
      tags: [Payments]
      summary: Verify Razorpay signature and issue a server-side paymentId (step 3)
      description: >
        Uses timing-safe HMAC-SHA256 comparison. On success, flips the
        Payment record to `status: "verified"` and returns its Mongo
        `paymentId`. **Store this `paymentId` and pass it to
        `POST /api/booking`.** It is single-use.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentRequest"
      responses:
        "200":
          description: Signature verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyPaymentResponse"
        "400":
          description: Missing fields or invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Payment does not belong to the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No payment order found for this razorpay_order_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  # ═══════════════════════════════════════════════════════════════════════════
  # BOOKINGS
  # ═══════════════════════════════════════════════════════════════════════════

  /api/booking:
    post:
      tags: [Bookings]
      summary: Create a confirmed booking (step 4 of the payment flow)
      description: >
        **Requires a verified, unused payment.** Runs inside a MongoDB
        transaction with `snapshot` read concern and `majority` write
        concern, so concurrent requests for the same room cannot
        overbook.

        Validations against the Payment record:
        - Belongs to the authenticated user
        - `status === "verified"`
        - `used === false`
        - Matches `hostelId`
        - `amount / 100` matches the booking amount

        On success: creates the Booking, marks the Payment `used: true`,
        links it to the booking, and returns the booking plus the updated
        availability calendar.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking:
                    $ref: "#/components/schemas/Booking"
                  calendar:
                    type: array
                    items:
                      $ref: "#/components/schemas/DayAvailability"
        "400":
          description: >
            Validation error, past check-in, unverified payment,
            amount mismatch, wrong hostel, or no availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Payment belongs to a different user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Payment or hostel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Duplicate receiptId, payment already used, or booking
            conflict (concurrent write)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      tags: [Bookings]
      summary: Get all bookings (admin only)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: All bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/booking/my-bookings:
    get:
      tags: [Bookings]
      summary: Get the authenticated user's bookings
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User's bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/booking/{id}:
    get:
      tags: [Bookings]
      summary: Get a booking by ID (owner or admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/booking/{id}/cancel:
    put:
      tags: [Bookings]
      summary: Cancel a booking (owner or admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  booking:
                    $ref: "#/components/schemas/Booking"
        "400":
          description: Already cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/booking/{id}/confirm:
    put:
      tags: [Bookings]
      summary: Manually confirm a pending booking (admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  booking:
                    $ref: "#/components/schemas/Booking"
        "400":
          description: Cannot confirm a cancelled booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/booking/{id}/receipt:
    get:
      tags: [Bookings]
      summary: Generate a receipt for a confirmed booking (owner or admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Receipt data
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  receipt:
                    type: object
                    properties:
                      bookingId:
                        type: string
                      receiptId:
                        type: string
                      user:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                      checkIn:
                        type: string
                        format: date-time
                      checkOut:
                        type: string
                        format: date-time
                      roomSelection:
                        type: string
                      totalAmount:
                        type: number
                      transactionId:
                        type: string
                      status:
                        type: string
        "400":
          description: Booking not confirmed yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════════════════
