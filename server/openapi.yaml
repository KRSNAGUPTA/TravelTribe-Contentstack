openapi: 3.1.0
info:
  title: TravelTribe API
  version: 1.1.0
  description: >
    Backend API for TravelTribe — a hostel booking platform.
    CMS content (hostel listings, images, descriptions) is served directly
    from Contentstack by the frontend. This API handles auth, availability,
    bookings, payments, and reviews.

    ## Hostel initialization model
    Hostel documents in MongoDB are initialized lazily — the first time a
    booking or availability check touches a CMS hostel entry, `ensureHostelInDb`
    creates a matching document with room_types and inventory seeded from CMS.
    Contentstack webhook integration is not used.

    ## Payment flow (4 steps)
    1. `POST /api/payment/create-order` — get a Razorpay order id
    2. Open the Razorpay checkout modal in the browser
    3. `POST /api/payment/verify-payment` — server verifies the HMAC signature
       and issues a short-lived `paymentId` (Mongo ObjectId)
    4. `POST /api/booking` — required to pass the `paymentId` from step 3

    Bookings are rejected unless the referenced payment is `verified`, not
    yet `used`, belongs to the same user, matches the hostel, and matches
    the amount. A payment can only fund one booking.

servers:
  - url: https://your-api-domain.com
    description: Production
  - url: http://localhost:5001
    description: Local dev

tags:
  - name: Auth
    description: Registration, login, Google OAuth, token refresh, password reset
  - name: Users
    description: User profile and admin user management
  - name: Hostels
    description: Hostel listing (proxied from Contentstack CMS) and availability calendar
  - name: Bookings
    description: Create and manage bookings (requires a verified payment)
  - name: Payments
    description: Razorpay order creation and server-side signature verification
  - name: Reviews
    description: Hostel reviews (requires a confirmed booking)
  - name: Misc
    description: Support, newsletter subscribe

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Short-lived access token (15 min). Obtain from `/api/user/login`
        or `/api/user/refresh`. Refresh tokens are delivered as HttpOnly
        cookies scoped to `/api/user/refresh`.

  schemas:

    UserPublic:
      type: object
      properties:
        id:
          type: string
          example: "664e1f2a3b4c5d6e7f8a9b0c"
        name:
          type: string
          example: "Arjun Sharma"
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        phone:
          type: string

    AuthResponse:
      type: object
      properties:
        message:
          type: string
        accessToken:
          type: string
          description: JWT access token, valid for 15 minutes.
        user:
          $ref: "#/components/schemas/UserPublic"

    RoomMeta:
      type: object
      properties:
        room_key:
          type: string
          example: "DORM"
        room_name:
          type: string
          example: "Mixed Dorm"
        totalBeds:
          type: integer
          example: 10

    DayAvailability:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2025-12-01"
        rooms:
          type: object
          additionalProperties:
            type: object
            properties:
              totalBeds:
                type: integer
              booked:
                type: integer
              available:
                type: integer

    AvailabilityResponse:
      type: object
      properties:
        hostelId:
          type: string
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        nights:
          type: integer
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/RoomMeta"
        calendar:
          type: array
          items:
            $ref: "#/components/schemas/DayAvailability"

    Booking:
      type: object
      properties:
        _id:
          type: string
        user:
          type: string
        hostelId:
          type: string
          description: Contentstack entry UID
        checkInDate:
          type: string
          format: date-time
        checkOutDate:
          type: string
          format: date-time
        roomSelection:
          type: string
          example: "DORM"
        amount:
          type: number
          example: 1500
        receiptId:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        gender:
          type: string
          enum: [male, female, other]
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        payment:
          type: string
          nullable: true
          description: Mongo ObjectId of the verified Payment that funded this booking
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateBookingRequest:
      type: object
      required:
        - checkIn
        - checkOut
        - hostelId
        - roomSelection
        - name
        - email
        - phone
        - gender
        - amount
        - receiptId
        - paymentId
      properties:
        checkIn:
          type: string
          format: date
          example: "2025-12-01"
        checkOut:
          type: string
          format: date
          example: "2025-12-04"
        hostelId:
          type: string
          example: "blt1234abcd5678ef90"
        roomSelection:
          type: string
          example: "DORM"
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        gender:
          type: string
          enum: [male, female, other]
        amount:
          type: number
          description: Total booking amount in INR
        receiptId:
          type: string
          description: Client-generated unique receipt (also the Razorpay order receipt)
        paymentId:
          type: string
          description: >
            Mongo ObjectId returned by `/api/payment/verify-payment` as `paymentId`.
            Must belong to the authenticated user, be `verified`, not yet `used`,
            and match both the hostel and the amount.

    CreateOrderRequest:
      type: object
      required: [amount, hostelId]
      properties:
        amount:
          type: number
          description: Amount in INR (server converts to paise)
          example: 1500
        currency:
          type: string
          default: INR
        hostelId:
          type: string

    CreateOrderResponse:
      type: object
      description: Raw Razorpay order object
      properties:
        id:
          type: string
          example: "order_PJXxxxxxxxxxxx"
        amount:
          type: integer
          description: Amount in paise
        currency:
          type: string
          example: "INR"
        receipt:
          type: string
        status:
          type: string
          example: "created"

    VerifyPaymentRequest:
      type: object
      required: [razorpay_order_id, razorpay_payment_id, razorpay_signature]
      properties:
        razorpay_order_id:
          type: string
        razorpay_payment_id:
          type: string
        razorpay_signature:
          type: string

    VerifyPaymentResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        paymentId:
          type: string
          description: >
            Mongo ObjectId of the Payment record. **Pass this to
            `POST /api/booking` as `paymentId`.** This is not the Razorpay
            payment id — it is the internal reference that ties the booking
            to the verified payment.
        orderId:
          type: string
          description: Razorpay order id
        paymentIdRazorpay:
          type: string
          description: Razorpay payment id
        amount:
          type: integer
        currency:
          type: string

    Review:
      type: object
      properties:
        _id:
          type: string
        user:
          type: string
        name:
          type: string
        img:
          type: string
          nullable: true
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time

    AddReviewRequest:
      type: object
      required: [rating, comment]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          minLength: 5
          maxLength: 1000

    Error:
      type: object
      properties:
        message:
          type: string

  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but insufficient role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Duplicate or state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:

  # ═══════════════════════════════════════════════════════════════════════════
  # AUTH
  # ═══════════════════════════════════════════════════════════════════════════

  /api/user/signup:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                phone:
                  type: string
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
        "400":
          description: Details missing or password too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      description: >
        Returns a 15-minute access token in the body and sets a 30-day
        HttpOnly refresh cookie scoped to `/api/user/refresh`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/google/callback:
    post:
      tags: [Auth]
      summary: Google OAuth login or first-time registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Google ID token
      responses:
        "200":
          description: Google login successful
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: No token provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue a new access token
      description: >
        Reads the HttpOnly refreshToken cookie. Verifies the token signature,
        checks `isRefresh === true`, then compares the SHA-256 hash of the
        incoming token against `user.refreshTokenHash`.

        On success: issues a new 15-minute access token AND rotates the
        refresh token (new cookie set, old one invalidated).

        **Reuse detection:** if the incoming token hash does not match the
        stored hash, the user's `refreshTokenHash` is cleared and the cookie
        is deleted — meaning a previously-used (potentially stolen) token
        triggers a forced logout for both the legitimate user and the attacker.
      responses:
        "200":
          description: New access token issued and refresh token rotated
          headers:
            Set-Cookie:
              description: New HttpOnly refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  accessToken:
                    type: string
        "401":
          description: Refresh cookie missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            Invalid or expired refresh token, wrong token type,
            or reuse detected (all clear the cookie)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/user/forgot-password:
    post:
      tags: [Auth]
      summary: Request a 6-digit OTP for password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: OTP sent (10-minute expiry)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Missing email or Google account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No account found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/verify-otp:
    post:
      tags: [Auth]
      summary: Verify the OTP before resetting password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/user/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using a verified OTP
      description: >
        On success, `refreshTokenHash` is cleared — all outstanding refresh
        tokens for this user are invalidated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Invalid OTP or password too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════════════════
  # USERS
  # ═══════════════════════════════════════════════════════════════════════════

  /api/user/profile:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profile returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  userData:
                    $ref: "#/components/schemas/UserPublic"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/user/update:
    patch:
      tags: [Users]
      summary: Update the authenticated user's profile
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                password:
                  type: string
                  minLength: 6
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Password too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/user/all:
    get:
      tags: [Users]
      summary: Get all users (admin only)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserPublic"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/user/search:
    get:
      tags: [Users]
      summary: Search users (admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: query
          schema:
            type: string
        - in: query
          name: role
          schema:
            type: string
            enum: [user, admin]
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserPublic"
        "404":
          description: No users found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/user/{id}:
    get:
      tags: [Users]
      summary: Get a user by ID (authenticated)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "400":
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Users]
      summary: Delete a user (admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/user/make-admin/{id}:
    patch:
      tags: [Users]
      summary: Promote a user to admin (admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User promoted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/user/remove-admin/{id}:
    patch:
      tags: [Users]
      summary: Demote an admin to user (admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Admin demoted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════════════════
  # HOSTELS
  # ═══════════════════════════════════════════════════════════════════════════

  /api/hostel:
    get:
      tags: [Hostels]
      summary: List hostels from Contentstack with filters and pagination
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 6
        - in: query
          name: q
          schema:
            type: string
          description: Search in title and address
        - in: query
          name: college
          schema:
            type: string
          description: Nearby college (use "all" to skip)
        - in: query
          name: location
          schema:
            type: string
          description: City or area (use "all" to skip)
        - in: query
          name: price
          schema:
            type: string
          description: Max price in INR (use "none" to skip)
      responses:
        "200":
          description: Paginated hostel list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalPages:
                        type: integer
                      hasNextPage:
                        type: boolean
                      hasPrevPage:
                        type: boolean
        "502":
          description: Contentstack CMS unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/hostel/availability:
    get:
      tags: [Hostels]
      summary: Per-night availability calendar
      description: >
        Returns a date-by-date breakdown of booked vs available beds.
        If the hostel has not been initialized in MongoDB, this endpoint
        creates it from CMS on the fly (lazy init).
      parameters:
        - in: query
          name: hostelId
          required: true
          schema:
            type: string
        - in: query
          name: checkIn
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: checkOut
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: roomSelection
          schema:
            type: string
      responses:
        "200":
          description: Availability calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "400":
          description: Missing params, invalid dates, or range > 90 nights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Hostel not found in CMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/hostel/{id}:
    get:
      tags: [Hostels]
      summary: Get the MongoDB record for a hostel (reviews + room inventory)
      description: >
        Returns the Mongo document. If the hostel hasn't been initialized yet,
        returns a shell object with empty `reviews` and `room_types`.
        CMS content (name, images, description) is fetched separately by the
        frontend directly from Contentstack.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hostel DB record (or empty shell)
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostelId:
                    type: string
                  reviews:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
                  room_types:
                    type: array
                    items:
                      type: object
                      properties:
                        room_key:
                          type: string
                        room_name:
                          type: string
                        total_beds:
                          type: integer
                        available_beds:
                          type: integer
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Hostels]
      summary: Delete a hostel DB record (admin only)
      description: >
        Rejected with 409 if the hostel has any pending or confirmed bookings.
        Returns 404 if the hostel was never initialized in MongoDB.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hostel deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not initialized in Mongo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Active bookings exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ═══════════════════════════════════════════════════════════════════════════
  # REVIEWS
  # ═══════════════════════════════════════════════════════════════════════════

  /api/hostel/{id}/reviews:
