services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    container_name: travel-tribe-server
    ports:
      - "5001:5001"
    env_file:
      - ./server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/traveltribe?replicaSet=rs0
    volumes:
      - ./server/src:/app/src
      - ./server/package.json:/app/package.json:ro
      - node_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    command: npm run dev
    working_dir: /app
    restart: unless-stopped
    networks:
      - traveltribe

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    container_name: travel-tribe-worker
    env_file:
      - ./server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/traveltribe?replicaSet=rs0
    volumes:
      - ./server/src:/app/src
      - ./server/package.json:/app/package.json:ro
      - node_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    command: node src/worker.js
    working_dir: /app
    restart: unless-stopped
    networks:
      - traveltribe

  mongo:
    image: mongo:7
    container_name: travel-tribe-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - traveltribe

  mongo-express:
    image: mongo-express
    container_name: travel-tribe-mongo-ui
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?replicaSet=rs0
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - traveltribe

volumes:
  mongo_data:
  node_modules:

networks:
  traveltribe:
    driver: bridge